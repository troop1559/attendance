  <script>

    const auth = firebase.auth();

    const LOGO = 'https://www.scouting.org/wp-content/uploads/2024/10/fleur-de-lis-2024-logo-4-c-bc-1@3x.png';
    ['loadingLogo','loginLogo','sideLogo'].forEach(id => document.getElementById(id).src = LOGO);
    const state = { currentUser: null, events: [], members: [], editors: [], page: 'home', returnPage: 'home', query: '', sort: 'desc', selectedScout: null, pendingEventHeader: '' };
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));
    const roleOf = user => String(user?.role || user?.accessLevel || user?.permission || user?.permissions || (user?.isAdmin ? 'Admin' : user?.isEditor ? 'Editor' : 'Scout')).trim().toLowerCase();
    const isEditor = () => ['editor', 'admin', 'administrator'].includes(roleOf(state.currentUser));
    const isAdmin = () => ['admin', 'administrator'].includes(roleOf(state.currentUser));
    const avatar = (url, name) => url || `https://ui-avatars.com/api/?name=${encodeURIComponent(name || 'Scout')}&background=173452&color=fff`;
    const eventLabel = (event, index) => typeof event === 'string' ? event : (event.title || event.name || event.label || `Event ${index + 1}`);
    const eventDate = event => typeof event === 'object' && event.date ? event.date : '';
    const formatDate = date => { if (!date) return 'No date'; const value = new Date(date); return Number.isNaN(value.getTime()) ? date : value.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' }); };
    const recordFor = (member, index) => String(member?.records?.[index] ?? '').toUpperCase();
    const percentage = member => { const records = member?.records || []; const marked = records.filter(value => ['Y','N'].includes(String(value).toUpperCase())); return marked.length ? Math.round(records.filter(value => String(value).toUpperCase() === 'Y').length / marked.length * 100) : 0; };

    // UI View Controllers
    function showView(viewId) { ['loadingView', 'loginView', 'appView'].forEach(id => document.getElementById(id).classList.toggle('hidden', id !== viewId)); }

    // Auth Change Listener
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        showView('loadingView');
        await loadSheetData(user.uid, user.photoURL);
      } else {
        showView('loginView');
      }
    });

    // Login Action
    document.getElementById('googleLoginBtn').onclick = () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(err => {
        const errEl = document.getElementById('loginError');
        errEl.innerText = err.message;
        errEl.classList.remove('hidden');
      });
    };

    document.getElementById('logoutBtn').onclick = () => auth.signOut();
    document.getElementById('profileControl').onclick = async event => { if (event.target.closest('#logoutBtn')) return; const existing=document.getElementById('profilePopover'); if(existing){existing.remove();return;} const popup=document.createElement('div'); popup.id='profilePopover'; popup.className='fixed right-4 top-16 z-50 w-64 rounded-2xl border border-slate-700 bg-slate-800 p-5 shadow-2xl'; popup.innerHTML=`<img src="${avatar(state.currentUser.photoUrl,state.currentUser.fullName)}" class="h-14 w-14 rounded-full"><p class="mt-3 font-bold">${esc(state.currentUser.fullName||'User')}</p><p class="mt-1 text-sm text-slate-400">${esc(roleOf(state.currentUser))}</p><code class="mt-3 block break-all text-xs text-blue-300">${esc(state.currentUser.userId||'')}</code><button id="copyProfileUid" class="mt-4 w-full rounded-xl bg-blue-600 py-2 text-sm font-bold text-white">Copy UID</button><button id="popupSignOut" class="mt-2 w-full rounded-xl border border-slate-700 py-2 text-sm">Sign out</button>`; document.body.appendChild(popup); document.getElementById('copyProfileUid').onclick=()=>navigator.clipboard.writeText(state.currentUser.userId||''); document.getElementById('popupSignOut').onclick=()=>auth.signOut(); };

    // Fetch Data from Apps Script
    async function loadSheetData(userId, authPhotoUrl) {
      try {
        const res = await fetch(`${APPS_SCRIPT_URL}?action=getInitialData&userId=${encodeURIComponent(userId)}`);
        const data = await res.json();

        if (data.status === "denied") {
          alert("Access Denied: Your account is not registered. To register your account, give your User ID (" + userId + ") to an Administrator.");
          auth.signOut();
          return;
        }

        state.currentUser = { ...(data.user || {}), role: data.user?.role || data.user?.accessLevel || data.role || data.accessLevel || data.permission };
        state.currentUser.userId = state.currentUser.userId || userId;
        state.events = data.events || [];
        state.members = data.members || [];
        state.editors = data.editors || [];

        // Fallback profile photo logic
        if (!state.currentUser.photoUrl && authPhotoUrl) {
          state.currentUser.photoUrl = authPhotoUrl;
        }

        document.getElementById('sideName').textContent = state.currentUser.fullName || 'User';
        document.getElementById('sideRole').textContent = roleOf(state.currentUser).replace(/^./, value => value.toUpperCase());
        document.getElementById('sideAvatar').src = avatar(state.currentUser.photoUrl, state.currentUser.fullName);
        document.getElementById('manageNav').classList.toggle('hidden', !isEditor());
        render();
        showView('appView');
        if (state.pendingEventHeader) { const pendingIndex=state.events.findIndex(event=>`${eventLabel(event,0)} - ${eventDate(event)}`===state.pendingEventHeader); state.pendingEventHeader=''; if(pendingIndex>=0) openAttendance(pendingIndex); }
      } catch (e) {
        alert("Failed to connect to Google Sheets server.");
        console.error(e);
      }
    }

    function render() { document.querySelectorAll('.nav-btn').forEach(button => button.classList.toggle('nav-active', button.dataset.page === state.page)); if (state.page === 'home') { renderHome(); limitHomeEvents(); renderHomeSummary(); } if (state.page === 'search') renderAllEvents(); if (state.page === 'manage') renderRoster(); }
    document.querySelectorAll('.nav-btn').forEach(button => button.onclick = () => { state.page = button.dataset.page; render(); });
    const heading = (title, subtitle, action = '') => `<div class="flex flex-wrap items-end justify-between gap-4"><div><button onclick="goBack()" class="mb-3 rounded-lg border border-slate-700 px-3 py-1 text-xs text-slate-300">← Back</button><p class="text-xs uppercase tracking-[.25em] text-emerald-300">Troop 1559</p><h1 class="mt-2 text-3xl font-bold">${title}</h1><p class="mt-2 text-blue-300">${subtitle}</p></div>${action}</div>`;
    function goBack() { state.page=state.returnPage || 'home'; render(); }

    function renderScoutHome() { const me = state.members.find(member => member.uid === state.currentUser.userId || member.userId === state.currentUser.userId || member.name === state.currentUser.fullName); document.getElementById('pageContent').innerHTML = heading(`Welcome, ${esc((state.currentUser.fullName || 'Scout').split(' ')[0])}`,'Your attendance record across troop events.') + `<div class="mt-8 grid gap-5 md:grid-cols-[220px_1fr]"><div class="rounded-2xl border border-emerald-400/30 bg-emerald-400/10 p-6"><p class="text-sm text-emerald-200">Overall attendance</p><p class="mt-3 text-5xl font-bold">${percentage(me)}<span class="text-2xl">%</span></p></div><div class="space-y-3">${state.events.map((event,index) => { const status=recordFor(me,index); return `<div class="flex items-center justify-between rounded-2xl border border-slate-800 bg-slate-800 p-4"><div><p class="font-semibold">${esc(eventLabel(event,index))}</p><p class="mt-1 text-xs text-slate-400">${esc(formatDate(eventDate(event)))}</p></div><span class="rounded-full px-3 py-1 text-xs font-bold ${status==='Y'?'bg-emerald-400/15 text-emerald-300':status==='N'?'bg-rose-400/15 text-rose-300':'bg-slate-700 text-slate-400'}">${status==='Y'?'Present':status==='N'?'Absent':'Not listed'}</span></div>`; }).join('')}</div></div><div class="mt-8 rounded-2xl border border-slate-800 bg-slate-800 p-6"><h2 class="font-bold">Profile picture</h2><p class="mt-1 text-sm text-slate-400">Paste a public image URL to update your roster profile.</p><div class="mt-4 flex flex-wrap gap-3"><input id="photoUrlInput" value="${esc(state.currentUser.photoUrl || '')}" placeholder="https://..." class="min-w-[220px] flex-1 rounded-xl border border-slate-700 bg-slate-950 p-3 text-sm"><button id="savePhotoBtn" class="rounded-xl bg-slate-100 px-4 py-2 text-sm font-bold text-slate-900">Save picture</button></div></div>`; document.getElementById('savePhotoBtn').onclick = savePhoto; }

    function renderAllEvents() { const term=state.query.toLowerCase(); const items=state.events.map((event,index)=>({event,index,title:eventLabel(event,index),date:eventDate(event),members:state.members.filter(member=>['Y','N'].includes(recordFor(member,index)))})).filter(item=>item.title.toLowerCase().includes(term)&&(!state.selectedScout||item.members.some(member=>member.name===state.selectedScout))).sort((a,b)=>(new Date(a.date)-new Date(b.date))*(state.sort==='asc'?-1:1)); document.getElementById('pageContent').innerHTML=heading('All Events','Search and open any event from the roster.')+`<div class="mt-8 flex flex-wrap gap-3"><input id="eventSearchInput" value="${esc(state.query)}" placeholder="Search events..." class="min-w-[220px] flex-1 rounded-xl border border-slate-700 bg-slate-800 p-3"><select id="eventSortSelect" class="rounded-xl border border-slate-700 bg-slate-800 p-3"><option value="desc" ${state.sort==='desc'?'selected':''}>Newest first</option><option value="asc" ${state.sort==='asc'?'selected':''}>Oldest first</option></select><select id="eventScoutFilter" class="rounded-xl border border-slate-700 bg-slate-800 p-3"><option value="">All selected scouts</option>${state.members.map(member=>`<option value="${esc(member.name)}" ${state.selectedScout===member.name?'selected':''}>${esc(member.name)}</option>`).join('')}</select></div><div class="mt-6 grid gap-3">${items.map(item=>`<button data-event-index="${item.index}" class="block w-full rounded-2xl border border-slate-800 bg-slate-800 p-4 text-left hover:border-blue-400"><p class="font-semibold">${esc(item.title)}</p><p class="mt-1 text-xs text-slate-400">${esc(formatDate(item.date))}</p><div class="mt-3 flex flex-wrap gap-2">${item.members.map(member=>`<img src="${avatar(member.photoUrl,member.name)}" title="${esc(member.name)}" class="h-8 w-8 rounded-full object-cover ${recordFor(member,item.index)==='Y'?'ring-2 ring-emerald-400':'ring-2 ring-rose-400'}">`).join('')}</div></button>`).join('')||'<p class="py-10 text-center text-slate-500">No events found.</p>'}</div>`; const input=document.getElementById('eventSearchInput'); input.oninput=event=>{const position=event.target.selectionStart;state.query=event.target.value;renderAllEvents();const refreshed=document.getElementById('eventSearchInput');refreshed.focus();refreshed.setSelectionRange(position,position);}; document.getElementById('eventSortSelect').onchange=event=>{state.sort=event.target.value;renderAllEvents();}; document.getElementById('eventScoutFilter').onchange=event=>{state.selectedScout=event.target.value;renderAllEvents();}; document.querySelectorAll('[data-event-index]').forEach(button=>button.onclick=()=>openAttendance(Number(button.dataset.eventIndex))); }
  </script>
